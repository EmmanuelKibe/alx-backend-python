name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: messaging_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config
          python -m pip install --upgrade pip
          pip install -r messaging_app/requirements.txt
          pip install pytest pytest-django pytest-cov flake8

      - name: Run Linting (flake8)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          # exit-zero treats all errors as warnings (we want it to fail, so we don't use it)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # max-line-length is 127 chars to be flexible
          flake8 . --count --max-line-length=127 --statistics

      - name: Run Tests with Coverage
        env:
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: messaging_db
          DB_USER: root
          DB_PASSWORD: root_password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
        run: |
          cd messaging_app
          pytest --cov=. --cov-report=html --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: messaging_app/htmlcov/